name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    needs: release-please
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [release-please, ci]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Applied before the app deploy, not after: the code being deployed in
      # this same release may already assume the new schema (e.g. a new
      # column or check constraint), so the DB has to be ahead of the code,
      # never behind it. Migrations here must stay additive/backward
      # compatible with the previous release for the brief window before the
      # Vercel deploy below completes.
      # - name: Apply pending Supabase migrations
      #   env:
      #     SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      #   run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      # Deliberately not `vercel build` + `vercel deploy --prebuilt`: that
      # builds locally in Actions, and `vercel pull` can never retrieve
      # Sensitive env vars (NEXT_PUBLIC_SUPABASE_URL and
      # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY are marked Sensitive), so the
      # local build would inline empty values. `vercel deploy` without
      # --prebuilt instead uploads source and builds on Vercel's own
      # infrastructure — the only place those vars decrypt — same as a
      # normal Git-triggered deploy, just gated on the release CI run.
      - run: npx vercel deploy --prod --yes
